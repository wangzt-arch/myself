    .page-loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f9fafb; }
    .page-loader__spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #4b5563; border-radius: 50%; animation: spin 0.8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .header { position: sticky; top: 0; z-index: 1200; width: 100%; background: rgba(255,255,255,0.92); }
  </style>
  <title>举个栗子 🌰</title>
